pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = 'ImmivioAndroid'
include ':player-plugin'
// Separate-UID diagnostic APK; excluded from ordinary app/plugin builds.
if (providers.gradleProperty('includeUriFixture').orNull == 'true') {
    include ':uri-fixture'
}

// Disposable emulator fixture; excluded from ordinary application builds.
if (providers.gradleProperty('includePerformanceFixture').orNull == 'true') { include ':performance-fixture' }
