# Gradle dependency versions.
[versions]
agp = "9.5.1"
aapt2 = "9.5.1-16666295"
kotlin = "2.4.21"
jcifs = "3.0.4"
icu-charset = "79.1"
slf4j = "1.7.36"
bouncycastle = "1.85"
junit = "4.13.2"
json = "20260814"
fragment = "1.8.6"
openxr-loader = "1.1.54"

[libraries]
icu-charset = { module = "com.ibm.icu:icu4j", version.ref = "icu-charset" }
jcifs = { module = "org.codelibs:jcifs", version.ref = "jcifs" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }
openxr-loader = { module = "org.khronos.openxr:openxr_loader_for_android", version.ref = "openxr-loader" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
