plugins {
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
    alias(libs.plugins.kotlin.android) apply false
}

def prepared = file('../build/android.properties')
if (!prepared.isFile()) {
    throw new GradleException('Run python3 configs/android_workflow.py configure after preparing the OpenXR addon.')
}
def preparedProperties = new Properties()
prepared.withInputStream { preparedProperties.load(it) }
subprojects {
    preparedProperties.each { key, value -> ext.set(key.toString(), value) }
}
apply from: 'gradle/dependency-cache.gradle'
