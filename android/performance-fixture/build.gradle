plugins { id 'com.android.application' }
android {
    namespace 'com.northboundwisdom.immivio.performancefixture'
    compileSdk androidCompileSdk.toInteger()
    buildToolsVersion androidBuildToolsVersion
    defaultConfig {
        applicationId 'com.northboundwisdom.immivio.performancefixture'
        minSdk androidMinSdk.toInteger()
        targetSdk androidCompileSdk.toInteger()
        versionCode 1
        versionName '1'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets.main.assets.srcDir '../../build/tests/performance-fixture'
    sourceSets.main.jniLibs.srcDir '../../build/tests/performance-fixture-libs'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation project(':player-plugin') }
