plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

// Immivio ships a single playback edition. Reject obsolete inference requests.
if (providers.gradleProperty('enableAi').orNull == 'true') {
    throw new GradleException('Immivio no longer supports inference builds.')
}
def standardMpv = providers.gradleProperty('standardMpv').map { it.toBoolean() }.getOrElse(true)
def playerAssets = layout.buildDirectory.dir('playerAssets')
def stagePlayerAssets = tasks.register('stagePlayerAssets', Sync) {
    from('src/main/assets')
    into(playerAssets)
    exclude 'rvm/**', 'rvm-mnn/**', 'depth-mnn/**', 'ai-models/**'
}

android {
    namespace 'org.vrpassthroughplayer.plugin'
    compileSdk 36
    buildToolsVersion '36.1.0'
    ndkVersion providers.gradleProperty('androidNdkVersion').getOrElse('29.0.14206865')
    buildFeatures { buildConfig true }
    sourceSets.main.assets.setSrcDirs([playerAssets])
    sourceSets.main.assets.srcDir '../../third_party'
    sourceSets.main.assets.srcDir '../../app/godot/i18n'
    sourceSets.main.assets.exclude 'rvm/**', 'rvm-mnn/**', 'depth-mnn/**', 'ai-models/**'
    defaultConfig {
        minSdk 29
        consumerProguardFiles 'consumer-rules.pro'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', "-DQUEST_STANDARD_MPV=${standardMpv ? 'ON' : 'OFF'}"
            }
        }
    }
    externalNativeBuild { cmake { path '../../native/CMakeLists.txt'; version providers.gradleProperty('androidCmakeVersion').getOrElse('3.31.6') } }
    // The Godot APK provides the matching NDK C++ shared runtime.
    packagingOptions { jniLibs { excludes += ['**/libc++_shared.so'] } }
    // A stale prior build must not reintroduce removed runtime libraries.
    packagingOptions { jniLibs { excludes += ['**/libquest_rvm.so', '**/libMNN*.so', '**/libncnn.so'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

tasks.named('preBuild').configure { dependsOn stagePlayerAssets }

// Only SMB is used by the player. jcifs also ships deprecated HTTP NTLM wrappers
// that copy a caller-supplied TLS verifier when reconnecting. Bundle a filtered
// local jar so the Godot export cannot reintroduce these unused adapters.
configurations {
    smbUpstream { canBeConsumed = false; transitive = false }
}
def smbClientJar = tasks.register('smbClientJar', Jar) {
    archiveFileName = 'jcifs-3.0.4-smb-client.jar'
    destinationDirectory = layout.buildDirectory.dir('smb-client')
    from({ zipTree(configurations.smbUpstream.singleFile) })
    exclude 'org/codelibs/jcifs/smb/http/**', 'org/codelibs/jcifs/smb/https/**'
    exclude 'org/codelibs/jcifs/smb1/http/**', 'org/codelibs/jcifs/smb1/https/**'
    exclude 'META-INF/MANIFEST.MF'
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

def godotApi = providers.gradleProperty('godotAarPath')
if (!godotApi.isPresent() || !file(godotApi.get()).isFile()) {
    throw new GradleException('Pass -PgodotAarPath=<Godot 4.7.2 Android template AAR>. Run tools/Build-Player.ps1 to prepare it.')
}
dependencies {
    // The exported Godot APK supplies this library. Never package a second engine.
    compileOnly files(godotApi.get())
    compileOnly files("../../app/godot/addons/quest_player/bin/cloudcore.aar")
    implementation 'androidx.media3:media3-exoplayer:1.10.1'
    // Preserve SMB2/3, NTLM authentication, signing and encryption (LGPL-2.1).
    smbUpstream 'org.codelibs:jcifs:3.0.4'
    implementation files(smbClientJar)
    // Match jcifs 3.0.4's upstream runtime dependencies; exported by Godot too.
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.85'
    testImplementation 'junit:junit:4.13.2'
    // JVM tests exercise org.json; android.jar only provides stubs.
    testImplementation 'org.json:json:20240303'
    // Debug Activity subclasses GodotActivity. The matching Godot export template
    // supplies Fragment 1.8.6; compile only, never package another host framework.
    debugCompileOnly 'androidx.fragment:fragment:1.8.6'
}

