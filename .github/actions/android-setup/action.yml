name: Prepare Android CI
description: Provision shared tools and playback caches for Windows and macOS
runs:
  using: composite
  steps:
    - name: Read toolchain requirements
      id: toolchain
      shell: python
      run: |
        import os, runpy
        requirements = runpy.run_path('configs/dependency_manifest.py')['catalog']()['toolchain']
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            for name in ('python', 'java', 'go'):
                output.write(name + '=' + requirements[name] + '\n')
            output.write('android_command_line_tools=' + requirements['android']['command_line_tools'] + '\n')
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ steps.toolchain.outputs.python }}
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
      with:
        distribution: temurin
        java-version: ${{ steps.toolchain.outputs.java }}
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: ${{ steps.toolchain.outputs.go }}
        cache: false
    - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      with:
        cmdline-tools-version: ${{ steps.toolchain.outputs.android_command_line_tools }}
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - name: Locate playback caches
      id: paths
      shell: python
      run: |
        import os
        paths = ['.cache/gradle', '.cache/go', 'build/dependency_seed_repos', 'build/host-tools',
                 'build/openlist-output', 'app/godot/addons/quest_player/bin/cloudcore.aar',
                 'app/godot/.godot/imported']
        with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
            output.write('paths<<CACHE_PATHS\n' + '\n'.join(paths) + '\nCACHE_PATHS\n')
    - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ steps.paths.outputs.paths }}
        key: ${{ runner.os }}-${{ runner.arch }}-immivio-freecm-v2-${{ hashFiles('FreeCM', 'source_roots.lock.jsonc.in', 'configs/*.py', 'cloud/openlist/*.go', 'native/mpv/patches/*', 'cloud/openlist/*.go', 'android/*.gradle', 'android/player-plugin/build.gradle') }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-immivio-freecm-v2-
    - name: Install locked Android SDK components
      shell: bash
      run: python configs/sdk_environment.py --install
