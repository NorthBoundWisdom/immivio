name: Check Android CI environment
description: Load the prepared runner toolchain and verify tools without installing them
runs:
  using: composite
  steps:
    - name: Load prepared macOS environment
      if: runner.os == 'macOS'
      shell: bash
      run: |
        source "${IMMIVIO_TOOLCHAIN_ENV:-$HOME/github-runners/toolchains/env.sh}"
        export GODOT_EXE="${GODOT_EXE:-${GODOT_BIN:-godot}}"
        python3 - <<'PY'
        import os
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
            for name in ('PATH', 'JAVA_HOME', 'ANDROID_HOME', 'ANDROID_SDK_ROOT',
                         'GODOT_EXE', 'GODOT_TEMPLATES_DIR', 'GRADLE_EXE',
                         'IMMIVIO_MPV_LIB_DIR', 'GOMODCACHE', 'GOCACHE', 'GOPATH',
                         'GRADLE_USER_HOME'):
                if os.environ.get(name):
                    output.write(name + '=' + os.environ[name] + '\n')
        PY
    - name: Load prepared Windows environment
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $environment = if ($env:IMMIVIO_TOOLCHAIN_ENV) { $env:IMMIVIO_TOOLCHAIN_ENV } else { Join-Path $env:SystemDrive 'github-runners/toolchains/env.ps1' }
        . $environment
        if (-not $env:GODOT_EXE -and $env:GODOT_BIN) { $env:GODOT_EXE = $env:GODOT_BIN }
        foreach ($name in @('PATH', 'JAVA_HOME', 'ANDROID_HOME', 'ANDROID_SDK_ROOT',
                            'GODOT_EXE', 'GODOT_TEMPLATES_DIR', 'GRADLE_EXE',
                            'IMMIVIO_MPV_LIB_DIR', 'GOMODCACHE', 'GOCACHE', 'GOPATH',
                            'GRADLE_USER_HOME')) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if ($value) { "$name=$value" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
        }
    - name: Check preinstalled tools and Android libraries
      shell: bash
      run: python configs/check_environment.py
