name: Immivio Android

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type (tags always use Release)
        type: choice
        default: Debug
        options: [Debug, Release]

env:
  CI_BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || inputs.build_type || 'Debug' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  create-release:
    name: Create tagged Release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Prepare tagged changelog
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          tag = os.environ['RELEASE_TAG']
          version = tag.removeprefix('v')
          changelog = Path('CHANGELOG.md').read_text(encoding='utf-8')
          section = re.search(r'^## ' + re.escape(version) + r'[^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          notes = section.group(1).strip() if section else f'Source release for `{tag}`.'
          notes += '\n\n[English release notes](https://northboundwisdom.github.io/immivio/updates/) · [中文更新说明](https://northboundwisdom.github.io/immivio/zh/updates/)\n'
          notes += '\nAndroid APKs are attached automatically after both Windows and macOS builds pass. Until APK assets appear, this release contains source archives only.\n'
          Path('tag-release-notes.md').write_text(notes, encoding='utf-8')
          PY
      - name: Create Release without waiting for Android runners
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GH_REPO" --verify-tag \
              --title "Immivio $RELEASE_TAG" --notes-file tag-release-notes.md
          fi

  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || inputs.build_type || 'Debug' }} / ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runner: macos-15
          - os: Windows
            runner: windows-2025
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize FreeCM
        run: git submodule update --init FreeCM
      - uses: ./.github/actions/android-setup
      - name: Build and test native host helpers
        run: |
          cmake -S native -B build/native-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native-host --config Release --parallel 2
          ctest --test-dir build/native-host -C Release --output-on-failure
      - name: Initialize and materialize locked dependencies
        run: |
          python configs/source_root_workflow.py --init --quiet
          python configs/source_root_workflow.py --update --quiet
      - name: Configure Android targets
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py configure --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done
      - name: Resolve application packages with Go and Gradle
        run: python configs/android_workflow.py prepare-packages --vendor Quest --build-type "$CI_BUILD_TYPE"
      - name: Build Android plugins
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py build --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done
      - name: Run workflow, JVM, Go and Godot tests
        run: python configs/android_workflow.py test --vendor Quest --build-type "$CI_BUILD_TYPE"
      - name: Package and verify Android targets
        env:
          CI_ANDROID_KEYSTORE_BASE64: ${{ env.CI_BUILD_TYPE == 'Release' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          CI_ANDROID_KEY_ALIAS: ${{ env.CI_BUILD_TYPE == 'Release' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          CI_ANDROID_KEY_PASSWORD: ${{ env.CI_BUILD_TYPE == 'Release' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py package --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done

      - name: Stop Gradle daemons
        if: always()
        run: python configs/android_workflow.py stop-gradle

      - name: Upload installable packages and build receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Immivio-Android-${{ env.CI_BUILD_TYPE }}-${{ runner.os }}
          path: |
            artifacts/Immivio-*.apk
            artifacts/Immivio-*.build.json
            artifacts/SHA256SUMS.txt
            artifacts/ci-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Immivio-Android-Logs-${{ runner.os }}
          path: |
            artifacts/logs/
            artifacts/ci-logs/
            artifacts/source-tests/
            android/player-plugin/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish tagged Android APKs
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, create-release]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-android-release.yml
    with:
      tag: ${{ github.ref_name }}
      run_id: ${{ format('{0}', github.run_id) }}
