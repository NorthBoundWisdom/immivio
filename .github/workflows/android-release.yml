name: Immivio Android

on:
  push:
    branches: ['**']
    tags: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type (tags always use Release)
        type: choice
        default: Debug
        options: [Debug, Release]

env:
  CI_BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || inputs.build_type || 'Debug' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || inputs.build_type || 'Debug' }} / ${{ matrix.os }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runner: [self-hosted, macOS, ARM64, pcbatlas, mac-mini]
          - os: Windows
            runner: [self-hosted, Windows, X64, pcbatlas, windows-cpp]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: false
          persist-credentials: false
      - name: Initialize FreeCM
        run: git submodule update --init FreeCM
      - uses: ./.github/actions/android-setup
      - name: Initialize and materialize locked dependencies
        run: |
          python configs/source_root_workflow.py --init --quiet
          python configs/source_root_workflow.py --update --quiet
      - name: Configure Android targets
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py configure --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done
      - name: Resolve application packages with Go and Gradle
        run: python configs/android_workflow.py prepare-packages --vendor Quest --build-type "$CI_BUILD_TYPE"
      - name: Build Android plugins
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py build --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done
      - name: Run workflow, JVM, Go and Godot tests
        run: python configs/android_workflow.py test --vendor Quest --build-type "$CI_BUILD_TYPE"
      - name: Package and verify Android targets
        env:
          CI_ANDROID_KEYSTORE_BASE64: ${{ env.CI_BUILD_TYPE == 'Release' && github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          CI_ANDROID_KEY_ALIAS: ${{ env.CI_BUILD_TYPE == 'Release' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          CI_ANDROID_KEY_PASSWORD: ${{ env.CI_BUILD_TYPE == 'Release' && github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py package --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done

      - name: Stop Gradle daemons
        if: always()
        run: python configs/android_workflow.py stop-gradle

      - name: Upload installable packages and build receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Immivio-Android-${{ env.CI_BUILD_TYPE }}-${{ runner.os }}
          path: |
            artifacts/Immivio-*.apk
            artifacts/Immivio-*.build.json
            artifacts/SHA256SUMS.txt
            artifacts/ci-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Immivio-Android-Logs-${{ runner.os }}
          path: |
            artifacts/logs/
            artifacts/ci-logs/
            artifacts/source-tests/
            android/player-plugin/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  publish-release:
    name: Publish tagged Android APKs
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/publish-android-release.yml
    with:
      tag: ${{ github.ref_name }}
      run_id: ${{ format('{0}', github.run_id) }}
