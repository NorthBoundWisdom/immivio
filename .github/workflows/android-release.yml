name: Android Release (no AI)

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      vendor:
        description: Android target
        type: choice
        default: all
        options: [all, Pico, Quest, OpenXR]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Release / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      GOMAXPROCS: '2'
      CI_VENDOR: ${{ inputs.vendor || 'all' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.1'
          cache: false
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Locate shared caches
        id: cache-paths
        shell: python
        run: |
          import os
          from pathlib import Path
          paths = ['~/.gradle/caches/modules-2', '~/.gradle/wrapper', '.cache/downloads',
                   '.cache/openlist/android-build.json', '.cache/ci-tools/templates',
                   'app/godot/addons/quest_player/bin/cloudcore.aar', 'app/godot/.godot/imported']
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as output:
              output.write('paths<<CACHE_PATHS\n' + '\n'.join(paths) + '\nCACHE_PATHS\n')
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: dependencies
        with:
          path: ${{ steps.cache-paths.outputs.paths }}
          key: ${{ runner.os }}-${{ runner.arch }}-android-noai-v3-${{ hashFiles('tools/environment/base-player.lock.json', 'third_party/mpv/manifest.json', 'cloud/openlist/*.go', 'android/*.gradle', 'android/player-plugin/build.gradle') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-android-noai-v3-

      - name: Prepare locked Godot and Android tools
        run: python tools/ci_android.py setup
      - name: Check source, dependency boundaries and Godot behavior
        run: python tools/ci_android.py test
      - name: Build and verify Android Release packages
        env:
          CI_ANDROID_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          CI_ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          CI_ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: python tools/ci_android.py build

      - name: Stop Gradle daemons before cache archival
        if: always()
        run: python tools/ci_android.py stop-gradle

      - name: Upload installable packages and build receipts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Android-noai-Release-${{ runner.os }}
          path: |
            artifacts/*.apk
            artifacts/*.build.json
            artifacts/SHA256SUMS.txt
            artifacts/ci-summary.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Android-noai-Logs-${{ runner.os }}
          path: |
            artifacts/logs/
            artifacts/ci-logs/
            artifacts/source-tests/
            android/player-plugin/build/test-results/
          if-no-files-found: warn
          retention-days: 7
