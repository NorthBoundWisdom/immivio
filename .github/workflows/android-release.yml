name: Immivio Android

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_type:
        description: APK build type (tags always use Release)
        type: choice
        default: Release
        options: [Debug, Release]

env:
  CI_BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || inputs.build_type || 'Debug' }}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || inputs.build_type || 'Debug' }} / macOS
    runs-on: macos-15-intel
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require formal signing for tag builds
        if: startsWith(github.ref, 'refs/tags/')
        env: &release-signing
          CI_ANDROID_KEYSTORE_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          CI_ANDROID_KEY_ALIAS: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_ALIAS || '' }}
          CI_ANDROID_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          if [[ -z "$CI_ANDROID_KEYSTORE_BASE64" || -z "$CI_ANDROID_KEY_ALIAS" || -z "$CI_ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::Configure the three Android signing repository secrets."
            exit 1
          fi
      - uses: ./.github/actions/android-setup
      - name: Build and test native host helpers
        run: |
          cmake -S native -B build/native/host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native/host --config Release --parallel 2
          mkdir -p artifacts/tests/native
          ctest --test-dir build/native/host -C Release --output-on-failure --output-junit "$PWD/artifacts/tests/native/junit.xml"
      - name: Prepare verified OpenXR addon
        run: python configs/prepare_assets.py --download
      - name: Configure Android targets
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py configure --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done
      - name: Resolve application packages with Gradle
        run: python configs/android_workflow.py prepare-packages --vendor Quest --build-type "$CI_BUILD_TYPE"
      - name: Build Android plugins
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py build --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done
      - name: Run workflow, JVM and Godot tests
        run: python configs/android_workflow.py test --vendor Quest --build-type "$CI_BUILD_TYPE"
      - name: Package and verify Android targets
        env: *release-signing
        run: |
          for target in Pico Quest OpenXR; do
            python configs/android_workflow.py package --vendor "$target" --build-type "$CI_BUILD_TYPE"
          done

      - name: Stop Gradle daemons
        if: always()
        run: python configs/android_workflow.py stop-gradle

      - name: Upload installable packages and build receipts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Immivio-Android-${{ env.CI_BUILD_TYPE }}-${{ runner.os }}
          path: |
            artifacts/packages/
            artifacts/reports/ci/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Immivio-Android-Logs-${{ runner.os }}
          path: |
            artifacts/logs/
            artifacts/tests/
            android/player-plugin/build/test-results/
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish tagged APKs
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write
    concurrency:
      group: android-release-assets-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag source and macOS build result
        id: source
        run: >-
          python3 tools/select_android_release.py
          --repository "$GH_REPO" --tag "$RELEASE_TAG" --run-id "$GITHUB_RUN_ID"
      - name: Download Release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Immivio-Android-Release-macOS
          path: build/staging/release-input
      - name: Verify Release receipts and APK hashes
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: >-
          python3 tools/prepare_android_release.py
          --packages build/staging/release-input
          --output "artifacts/packages/releases/$RELEASE_TAG" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Publish APKs on the tag's GitHub Release
        run: |
          directory="artifacts/packages/releases/$RELEASE_TAG"
          assets=("$directory"/*.apk "$directory"/*.build.json "$directory/SHA256SUMS.txt" "$directory/release-manifest.json")
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            python3 tools/publish_android_release.py --bundle "$directory" --repository "$GH_REPO" --tag "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --verify-tag \
              --title "Immivio $RELEASE_TAG" --notes-file "$directory/release-notes.md"
          fi
      - name: Refresh website downloads
        # Releases created with GITHUB_TOKEN do not trigger other workflows; dispatch does.
        run: gh workflow run website-pages.yml --repo "$GH_REPO" --ref main
