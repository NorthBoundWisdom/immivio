name: Publish Android tag APKs

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        type: string
        required: true
      run_id:
        description: Successful Android tag build run ID
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check tag source and macOS build result
        id: source
        run: >-
          python3 tools/select_android_release.py
          --repository "$GH_REPO" --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID"
      - name: Download canonical Immivio Release packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Immivio-Android-Release-macOS
          path: build/staging/release-input
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Verify Release receipts and APK hashes
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: >-
          python3 tools/prepare_android_release.py
          --packages build/staging/release-input
          --output "artifacts/packages/releases/$RELEASE_TAG" --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Publish APKs on the tag's GitHub Release
        run: |
          directory="artifacts/packages/releases/$RELEASE_TAG"
          assets=("$directory"/*.apk "$directory"/*.build.json "$directory/SHA256SUMS.txt" "$directory/release-manifest.json")
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
            gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --notes-file "$directory/release-notes.md"
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --verify-tag \
              --title "Immivio $RELEASE_TAG" --notes-file "$directory/release-notes.md"
          fi
