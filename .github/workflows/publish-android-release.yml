name: Publish Android tag APKs

on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
      run_id:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        type: string
        required: true
      run_id:
        description: Successful Android tag build run ID
        type: string
        required: true

permissions:
  contents: write
  actions: read

concurrency:
  group: android-release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check tag source and all four build results
        id: source
        run: >-
          python3 tools/select_android_release.py
          --repository "$GH_REPO" --tag "$RELEASE_TAG" --run-id "$SOURCE_RUN_ID"
      - name: Download canonical model-free Release packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: Android-noai-Release-macOS
          path: artifacts/release-input/noai
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Download canonical AI Release packages
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: Android-ai-Release-macOS
          path: artifacts/release-input/ai
          run-id: ${{ inputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
      - name: Verify Release receipts and APK hashes
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: >-
          python3 tools/prepare_android_release.py
          --noai artifacts/release-input/noai --ai artifacts/release-input/ai
          --output artifacts/release --tag "$RELEASE_TAG" --commit "$SOURCE_COMMIT"
      - name: Publish APKs on the tag's GitHub Release
        run: |
          assets=(artifacts/release/*.apk artifacts/release/*.build.json artifacts/release/SHA256SUMS.txt artifacts/release/release-manifest.json)
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --repo "$GH_REPO" --verify-tag \
              --title "Thru3D $RELEASE_TAG" --notes-file artifacts/release/release-notes.md
          fi
