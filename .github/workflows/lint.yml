name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-lint.txt
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Prepare pinned lint tools
        run: |
          python3 -m pip install -r requirements-lint.txt
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import urllib.request
          record = json.loads(Path('configs/lint_tools.json').read_text())['ktfmt']
          with urllib.request.urlopen(record['url'], timeout=60) as source:
              Path(os.environ['RUNNER_TEMP'], 'ktfmt.jar').write_bytes(source.read())
          PY
      - name: Check formatting
        run: python3 tools/check_format.py --ktfmt "$RUNNER_TEMP/ktfmt.jar"
      - name: Check sources and website
        run: |
          python3 tools/Check-PublicSource.py
          python3 tools/check_website.py
          python3 tools/check_translations.py
          python3 tools/check_godot_resources.py
      - name: Run workflow and website tests
        run: |
          python3 -m unittest discover -s tests/workflow
          python3 -m unittest discover -s tests/website
